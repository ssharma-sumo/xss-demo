<body>
    <h1>Hello, World!</h1>
    <div id="user"></div>

<script>

    const setCookies = () => {
        document.cookie = "dummyCookie=HelloWorld; SameSite=None; Secure";
    }
    setCookies();
</script>

<script>
    //read name from query params
    const urlParams = new URLSearchParams(window.location.search);
    const userName = urlParams.get('name');
    // Example JavaScript code
    document.getElementById("user").innerHTML = userName;
</script>


<script>
    //create post for user
    const createPost = (title , description) => {
        // make post request to server with title and description with dummy api
        fetch('https://jsonplaceholder.typicode.com/posts', {
            method: 'POST',
            body: JSON.stringify({
                title: title,
                body: description,
                userId: 1,
            }),
            headers: {
                'Content-type': 'application/json; charset=UTF-8',
            },
        })
    }
</script>
